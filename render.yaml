services:
  - type: web
    name: concierge-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        sync: false
      # Embeddings for the Emerson tone model (app/services/tone_guard.py).
      # Without it the model file still deploys but cannot be scored against, so
      # tone ranking degrades to off and replies ship unranked.
      - key: EMBEDDING_KEY
        sync: false
